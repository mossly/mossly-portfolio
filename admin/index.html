<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Mossly</title>

  <!-- Apply saved theme before paint (authoritative over OS preference) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'lofi')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'lofi')
      }
    })()
  </script>
</head>
<body>
  <div class="min-h-screen bg-base-100 text-base-content">
    <header class="navbar bg-base-100 shadow-lg sticky top-0 z-50">
      <div class="navbar-start">
        <a href="/" class="btn btn-ghost text-xl flex items-center gap-2">
          <img src="/Kea_Transparent.png" alt="Kea logo" class="w-8 h-8 rounded-full">
          Mossly
        </a>
        <span class="text-base-content/30 mx-1 hidden sm:inline">/</span>
        <span class="hidden sm:inline text-lg font-semibold tracking-tight">Admin</span>
      </div>
      <div class="navbar-end gap-2">
        <div id="admin-stats" class="text-sm text-base-content/60"></div>
        <a href="/" class="btn btn-ghost btn-sm">View site</a>
        <button data-theme-toggle type="button" class="btn btn-ghost btn-circle" aria-label="Toggle light/dark theme" aria-pressed="false">
          <svg class="theme-icon-light h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <svg class="theme-icon-dark h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:py-10 space-y-12">
      <!-- Upload (3E-3) -->
      <section id="upload-section" class="space-y-3">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-base-content/50">Upload</h2>
        <div class="max-w-xl mx-auto space-y-3">
          <div class="flex items-center gap-2">
            <label for="upload-category" class="text-sm font-medium">Category</label>
            <select id="upload-category" class="select select-sm"></select>
          </div>

          <div id="dropzone"
               class="border-2 border-dashed border-base-300 rounded-lg p-8 text-center cursor-pointer transition-colors hover:border-primary hover:bg-base-200/40">
            <svg class="w-8 h-8 mx-auto mb-2 text-base-content/40" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
            <p class="font-medium">Drag photos here, or click to choose files</p>
            <p class="text-sm text-base-content/60 mt-1">JPEG or PNG. Multiple files OK.</p>
            <input id="file-input" type="file" accept="image/jpeg,image/png" multiple class="hidden">
          </div>

          <ul id="upload-queue" class="space-y-1"></ul>
        </div>
      </section>

      <!-- Metadata cleanup: bulk mapping rules -->
      <section id="metadata-section" class="space-y-3">
        <button type="button" id="metadata-toggle"
                class="flex items-center gap-2 text-sm font-semibold uppercase tracking-wider text-base-content/50 hover:text-base-content transition-colors">
          <svg id="metadata-chevron" class="w-4 h-4 transition-transform" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
          Metadata cleanup
        </button>
        <div id="metadata-root" class="hidden"></div>
      </section>

      <!-- Grid (3E-2) -->
      <section id="loading-state" class="text-center py-20 text-base-content/60">Loading photos&hellip;</section>
      <section id="error-state" class="hidden text-center py-20 text-error"></section>
      <div id="gallery-root" class="space-y-12"></div>
    </main>

    <hr class="border-base-300 mt-4">
    <footer class="text-base-content/60 py-6">
      <div class="max-w-7xl mx-auto px-4 text-right">
        <a href="/" class="text-base-content/60 hover:text-base-content">&larr; Back to site</a>
      </div>
    </footer>
  </div>

  <div id="confirm-root"></div>

  <script type="module" src="/admin/main.ts"></script>
</body>
</html>
